<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="products">
      <article
        class="card"
        data-qa="card"
      >
        <div
          class="card__media"
          aria-hidden="true"
        ></div>

        <div class="card__content">
          <h2 class="card__title">
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </h2>
          <p class="card__code">Product code: 195434</p>

          <div class="card__rating">
            <div class="stars stars--4">
              <div class="stars__item"></div>
              <div class="stars__item"></div>
              <div class="stars__item"></div>
              <div class="stars__item"></div>
              <div class="stars__item"></div>
            </div>
            <span class="card__reviews">Reviews: 5</span>
          </div>

          <div class="card__footer">
            <span class="card__label">Price:</span>
            <div class="card__price">$2,199</div>
          </div>
          <a
            class="card__buy"
            href="#"
            data-qa="hover"
          >
            BUY
          </a>
        </div>
      </article>

      <article
        class="card"
        data-qa="card"
      >
        <div
          class="card__media"
          aria-hidden="true"
        ></div>

        <div class="card__content">
          <h2 class="card__title">
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </h2>
          <p class="card__code">Product code: 195434</p>

          <div class="card__rating">
            <div class="stars stars--4">
              <div class="stars__item"></div>
              <div class="stars__item"></div>
              <div class="stars__item"></div>
              <div class="stars__item"></div>
              <div class="stars__item"></div>
            </div>
            <span class="card__reviews">Reviews: 5</span>
          </div>

          <div class="card__footer">
            <span class="card__label">Price:</span>
            <div class="card__price">$2,199</div>
          </div>
          <a
            class="card__buy"
            href="#"
            data-qa="hover"
          >
            BUY
          </a>
        </div>
      </article>
    </main>
  </body>
</html>
